      /* Truncate 2 lines neatly */

        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Offscreen rendering & layout containment for long lists (FPS++) */

      /*************************************************************************

      function loadQuizzesFromStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            // Tanamkan paket soal demo bawaan jika LocalStorage masih kosong
            state.quizzes = structuredClone(DEFAULT_SAMPLE_QUIZZES);
            saveQuizzesToStorage();
            return;
          }
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            state.quizzes = parsed;
          } else {
            state.quizzes = structuredClone(DEFAULT_SAMPLE_QUIZZES);
            saveQuizzesToStorage();
          }
        } catch (err) {
          console.error("Gagal membaca LocalStorage:", err);
          state.quizzes = structuredClone(DEFAULT_SAMPLE_QUIZZES);
        }
      }

      function saveQuizzesToStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.quizzes));
        } catch (err) {
          console.error("Gagal menyimpan ke LocalStorage:", err);
          showToast("Gagal menyimpan data ke LocalStorage browser.", "error");
        }
      }

      /**
       * Algoritma Fisher-Yates Shuffle murni (tidak memutasi array asli)
       */
      function fisherYatesShuffle(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function getTodayISO() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      const HTML_ESCAPE_MAP = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      };
      const HTML_ESCAPE_RE = /[&<>"']/g;

      function escapeHtml(str) {
        if (str === null || str === undefined || str === "") return "";
        return String(str).replace(HTML_ESCAPE_RE, (ch) => HTML_ESCAPE_MAP[ch]);
      }

      /**
       * Perhitungan Skor Evaluasi
       */
      function calculateScore(sessionQuestions, answersMap) {
        const total = sessionQuestions.length;
        let correctCount = 0;
        let wrongCount = 0;
        let unansweredCount = 0;

        const details = sessionQuestions.map((q, index) => {
          const selectedOptionId = answersMap[q.id] || null;
          const isUnanswered = !selectedOptionId;
          const isCorrect =
            !isUnanswered && selectedOptionId === q.correctOptionId;

          if (isCorrect) {
            correctCount++;
          } else if (isUnanswered) {
            unansweredCount++;
          } else {
            wrongCount++;
          }

          const userOptionObj =
            q.options.find((o) => o.id === selectedOptionId) || null;
          const correctOptionObj =
            q.options.find((o) => o.id === q.correctOptionId) || null;

          return {
            number: index + 1,
            questionId: q.id,
            questionText: q.questionText,
            options: q.options,
            selectedOptionId,
            correctOptionId: q.correctOptionId,
            userOptionText: userOptionObj ? userOptionObj.text : null,
            correctOptionText: correctOptionObj ? correctOptionObj.text : "-",
            isCorrect,
            isUnanswered,
          };
        });

        const wrongOrEmptyCount = wrongCount + unansweredCount;
        const rawScore = total > 0 ? (correctCount / total) * 100 : 0;
        const finalScore = Number.isInteger(rawScore)
          ? rawScore
          : Number(rawScore.toFixed(1));
        const accuracyPercent = Math.round(rawScore);

        return {
          total,
          correctCount,
          wrongCount,
          unansweredCount,
          wrongOrEmptyCount,
          finalScore,
          accuracyPercent,
          details,
        };
      }

      /**
       * Toast Notification Helper
       */
      function showToast(message, type = "info") {
        const root = document.getElementById("toast-root");
        if (!root) return;

        const colors = {
          success: "bg-emerald-600 text-white border-emerald-700",
          error: "bg-red-600 text-white border-red-700",
          info: "bg-slate-800 text-white border-slate-700",
        };
        const iconSvg =
          type === "success"
            ? `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`
            : type === "error"
              ? `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>`
              : `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;

        const item = document.createElement("div");
        item.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl border shadow-lg text-xs sm:text-sm font-medium animate-view ${colors[type] || colors.info}`;
        item.innerHTML = `${iconSvg}<span>${escapeHtml(message)}</span>`;
        root.appendChild(item);

        setTimeout(() => {
          item.style.opacity = "0";
          item.style.transition = "opacity 0.25s ease";
          setTimeout(() => item.remove(), 250);
        }, 3200);
      }

      function executeDeleteQuiz(quizId) {

      /*************************************************************************
       * 6. EXPORT & IMPORT JSON HANDLERS
       *************************************************************************/
      let currentImportMode = "replace"; // 'replace' = kartu lama hilang | 'overwrite' = kartu lama tidak hilang

      function handleExportJSON() {
        if (state.quizzes.length === 0) {
          showToast("Tidak ada data paket soal untuk diekspor.", "error");
          return;
        }
        const dataStr = JSON.stringify(state.quizzes, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = `sts-portal-backup-${getTodayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("Data JSON berhasil diunduh!", "success");
      }

      function triggerImportJSON(mode = "replace") {
        currentImportMode = mode;
        const fileInput = document.getElementById("import-json-input");
        fileInput.value = "";
        fileInput.click();
      }

      document
        .getElementById("import-json-input")
        .addEventListener("change", (event) => {
          const file = event.target.files?.[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const parsed = JSON.parse(e.target.result);
              const importedList = Array.isArray(parsed) ? parsed : [parsed];

              // Validasi struktur dasar JSON
              const validQuizzes = [];
              for (const item of importedList) {
                if (
                  item &&
                  typeof item.title === "string" &&
                  item.title.trim() !== "" &&
                  Array.isArray(item.questions) &&
                  item.questions.length >= 1 &&
                  item.questions.length <= 50
                ) {
                  const sanitizedQuestions = item.questions.map((q, idx) => ({
                    id: q.id || `q${idx + 1}`,
                    questionText: String(q.questionText || "").trim(),
                    options: OPTION_IDS.map((optId, optIdx) => {
                      const found = Array.isArray(q.options)
                        ? q.options.find((o) => o.id === optId) ||
                          q.options[optIdx]
                        : null;
                      return {
                        id: optId,
                        text:
                          found && found.text ? String(found.text).trim() : "",
                      };
                    }),
                    correctOptionId: OPTION_IDS.includes(q.correctOptionId)
                      ? q.correctOptionId
                      : "opt_a",
                  }));

                  validQuizzes.push({
                    id:
                      item.id ||
                      `quiz_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                    title: item.title.trim(),
                    accentColor: ACCENT_PALETTE.includes(item.accentColor)
                      ? item.accentColor
                      : pickRandomAccentColor(),
                    createdAt: item.createdAt || getTodayISO(),
                    questions: sanitizedQuestions,
                  });
                }
              }

              if (validQuizzes.length === 0) {
                showToast(
                  "Format file JSON tidak sesuai dengan skema STS Portal.",
                  "error",
                );
                return;
              }

              if (currentImportMode === "overwrite") {
                // Mode Overwrite JSON: Kartu sebelumnya TIDAK hilang
                validQuizzes.forEach((imp) => {
                  const existingIdx = state.quizzes.findIndex(
                    (q) =>
                      q.id === imp.id &&
                      q.title.trim().toLowerCase() ===
                        imp.title.trim().toLowerCase(),
                  );
                  if (existingIdx > -1) {
                    state.quizzes[existingIdx] = imp;
                  } else {
                    const idExists = state.quizzes.some((q) => q.id === imp.id);
                    if (idExists) {
                      imp.id = `quiz_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
                    }
                    state.quizzes.unshift(imp);
                  }
                });

                saveQuizzesToStorage();
                renderApp();
                showToast(
                  `Overwrite JSON berhasil! ${validQuizzes.length} paket soal ditambahkan (kartu sebelumnya tetap ada).`,
                  "success",
                );
              } else {
                // Mode Impor JSON: Kartu sebelumnya HILANG semua tanpa sisa
                state.quizzes = validQuizzes;
                state.currentQuiz = null;
                state.evaluationResult = null;
                state.userAnswers = {};
                state.flaggedQuestions = {};

                saveQuizzesToStorage();
                renderApp();
                showToast(
                  `Impor JSON berhasil! Menampilkan ${validQuizzes.length} paket soal baru (kartu sebelumnya dihapus).`,
                  "success",
                );
              }
            } catch (err) {
              console.error(err);
              showToast("File JSON rusak atau tidak valid.", "error");
            }
          };
          reader.readAsText(file);
        });

      /*************************************************************************

      function syncSingleQuestionFromDOM(qIdx) {
        const q = state.editorDraft.questions[qIdx];
        if (!q) return;
        const qTextEl = document.getElementById(`editor-qtext-${qIdx}`);

      function buildPaletteButtonsHtml(accentColor) {

            style="background-color: ${color};"
            title="Pilih Warna Aksen ${color}">

        }).join("");
      }

      function buildEditorQuestionCardHtml(q, qIdx, canDeleteQuestion) {
        const optionsRowsHtml = q.options
          .map((opt, optIdx) => {
            const letter = OPTION_LETTERS[optIdx];
            const isKey = q.correctOptionId === opt.id;

            return `
            <div class="flex items-center gap-2.5 sm:gap-3 p-2 rounded-xl border ${
              isKey
                ? "bg-[#ECFDF5]/70 border-emerald-300"

              <!-- Badge Huruf Opsi -->
              <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 ${
                isKey
                  ? "bg-[#10B981] text-white"

              }">
                ${letter}
              </span>

              <!-- Input Teks Opsi -->
              <input
                type="text"
                id="editor-opt-${qIdx}-${optIdx}"

              <!-- Radio Button Kunci Jawaban (Simbol saja di HP) -->

                <span class="hidden sm:inline">${isKey ? "✓ Kunci Benar" : "Jadikan Kunci"}</span>
              </label>
            </div>
          `;
          })
          .join("");

        return `
          <div id="editor-question-card-${qIdx}" class="perf-card bg-white rounded-2xl border border-[#E2E8F0] shadow-sm p-5 sm:p-6">

                    ? `<span class="inline-flex items-center gap-1 text-xs font-semibold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200">

              <button

      function selectEditorAccent(color) {
        state.editorDraft.accentColor = color;
        const barEl = document.getElementById("editor-accent-bar");
        const paletteEl = document.getElementById("editor-palette-container");
        if (barEl) barEl.style.backgroundColor = color;
        if (paletteEl) paletteEl.innerHTML = buildPaletteButtonsHtml(color);
      }

      function handleSelectCorrectOption(qIdx, optId) {
        syncSingleQuestionFromDOM(qIdx);
        state.editorDraft.questions[qIdx].correctOptionId = optId;
        const cardEl = document.getElementById(`editor-question-card-${qIdx}`);
        if (cardEl) {
          const canDeleteQuestion = state.editorDraft.questions.length > 1;
          cardEl.outerHTML = buildEditorQuestionCardHtml(
            state.editorDraft.questions[qIdx],
            qIdx,
            canDeleteQuestion,
          );
        } else {
          renderEditor();
        }
      }

      function handleAddQuestion() {
        if (state.editorDraft.questions.length >= 50) {
          showToast(
            "Batas maksimal 50 soal per paket telah tercapai.",
            "error",
          );
          return;
        }
        const prevLen = state.editorDraft.questions.length;
        const nextNum = prevLen + 1;
        const newQ = createBlankQuestion(nextNum);
        state.editorDraft.questions.push(newQ);

        const listEl = document.getElementById("editor-questions-list");
        if (listEl) {
          if (prevLen === 1) {
            syncSingleQuestionFromDOM(0);
            const firstCardEl = document.getElementById(
              "editor-question-card-0",
            );
            if (firstCardEl) {
              firstCardEl.outerHTML = buildEditorQuestionCardHtml(
                state.editorDraft.questions[0],
                0,
                true,
              );
            }
          }
          listEl.insertAdjacentHTML(
            "beforeend",
            buildEditorQuestionCardHtml(newQ, nextNum - 1, true),
          );
          renderHeader();
        } else {
          syncEditorInputsFromDOM();
          renderEditor();
        }

        requestAnimationFrame(() => {
          const newCard = document.getElementById(
            `editor-question-card-${nextNum - 1}`,
          );
          if (newCard) {
            newCard.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        });
      }

      function handleRemoveQuestion(qIdx) {
        syncEditorInputsFromDOM();
        if (state.editorDraft.questions.length <= 1) {
          showToast("Minimal harus terdapat 1 soal dalam paket.", "error");
          return;
        }
        state.editorDraft.questions.splice(qIdx, 1);
        renderEditor();
        showToast(`Soal #${qIdx + 1} dihapus.`, "info");
      }

      function validateEditorDraft() {
        syncEditorInputsFromDOM();
        const errors = [];
        let firstInvalidQuestionIndex = null;

        if (!state.editorDraft.title || state.editorDraft.title.trim() === "") {
          errors.push("Judul Paket Soal wajib diisi dan tidak boleh kosong.");
        }

        const qCount = state.editorDraft.questions.length;
        if (qCount < 1 || qCount > 50) {
          errors.push("Jumlah soal harus berada di rentang 1 hingga 50 soal.");
        }

        state.editorDraft.questions.forEach((q, idx) => {
          const qNum = idx + 1;
          const missingParts = [];

          if (!q.questionText || q.questionText.trim() === "") {
            missingParts.push("teks pertanyaan kosong");
          }

          const emptyOptionLetters = [];
          q.options.forEach((opt, optIdx) => {
            if (!opt.text || opt.text.trim() === "") {
              emptyOptionLetters.push(OPTION_LETTERS[optIdx]);
            }
          });
          if (emptyOptionLetters.length > 0) {
            missingParts.push(`opsi ${emptyOptionLetters.join(", ")} kosong`);
          }

          if (!OPTION_IDS.includes(q.correctOptionId)) {
            missingParts.push("kunci jawaban belum dipilih");
          }

          if (missingParts.length > 0) {
            if (firstInvalidQuestionIndex === null) {
              firstInvalidQuestionIndex = idx;
            }
            errors.push(`Soal No. ${qNum}: ${missingParts.join(", ")}.`);
          }
        });

        state.editorDraft.validationErrors = errors;
        return {
          isValid: errors.length === 0,
          errors,
          firstInvalidQuestionIndex,
        };
      }

      function handleSaveQuiz() {
        const validation = validateEditorDraft();
        if (!validation.isValid) {
          renderEditor();
          showToast(
            `Terdapat ${validation.errors.length} bagian yang belum lengkap. Periksa peringatan di atas.`,
            "error",
          );

          if (validation.firstInvalidQuestionIndex !== null) {
            setTimeout(() => {
              const targetEl = document.getElementById(
                `editor-question-card-${validation.firstInvalidQuestionIndex}`,
              );
              if (targetEl) {
                targetEl.scrollIntoView({
                  behavior: "smooth",
                  block: "center",
                });
                targetEl.classList.add("animate-shake");
              }
            }, 60);
          } else {
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
          return;
        }

        // Normalisasi ID soal berurutan q1, q2, ...
        const finalQuiz = {
          id: state.editorDraft.id,
          title: state.editorDraft.title.trim(),
          accentColor: state.editorDraft.accentColor,
          createdAt: state.editorDraft.createdAt || getTodayISO(),
          questions: state.editorDraft.questions.map((q, idx) => ({
            id: `q${idx + 1}`,
            questionText: q.questionText.trim(),
            options: q.options.map((opt, oIdx) => ({
              id: OPTION_IDS[oIdx],
              text: opt.text.trim(),
            })),
            correctOptionId: q.correctOptionId,
          })),
        };

        const existingIndex = state.quizzes.findIndex(
          (item) => item.id === finalQuiz.id,
        );
        if (existingIndex > -1) {
          state.quizzes[existingIndex] = finalQuiz;
        } else {
          state.quizzes.unshift(finalQuiz);
        }

        saveQuizzesToStorage();
        showToast("Paket soal berhasil disimpan!", "success");
        navigateToHome();
      }

        navigateToHome();
      }

      function renderEditor() {

      /*************************************************************************
       * 8. VIEW C: HALAMAN SOAL (EXAM VIEW) & RANDOMIZATION ENGINE
       *************************************************************************/
      const EXAM_DURATION_SECONDS = 45 * 60; // 45 menit (2700 detik)

      function formatTimerMMSS(totalSeconds) {
        const safeSec = Math.max(0, Math.floor(totalSeconds));
        const mins = String(Math.floor(safeSec / 60)).padStart(2, "0");
        const secs = String(safeSec % 60).padStart(2, "0");
        return `${mins}:${secs}`;
      }

      function stopExamTimer() {
        if (state.timerIntervalId) {
          clearInterval(state.timerIntervalId);
          state.timerIntervalId = null;
        }
      }

      function updateTimerDOMOnly() {
        const displayEl = document.getElementById("exam-timer-display");
        if (displayEl) {
          displayEl.textContent = formatTimerMMSS(state.remainingSeconds);
        }
        // Hanya ubah className tepat saat menyentuh batas 5 menit (300 detik) agar tidak memicu style recalculation tiap detik
        if (state.remainingSeconds === 300) {
          const boxEl = document.getElementById("exam-timer-box");
          if (boxEl) {
            boxEl.className =
              "mb-4 p-3.5 rounded-xl border bg-red-50 border-red-200 text-red-700 flex items-center justify-between transition-colors";
          }
        }
      }

      function startExamTimer() {
        stopExamTimer();
        state.remainingSeconds = EXAM_DURATION_SECONDS;
        state.timerIntervalId = setInterval(() => {
          if (state.view !== "EXAM") {
            stopExamTimer();
            return;
          }
          state.remainingSeconds -= 1;
          updateTimerDOMOnly();

          if (state.remainingSeconds <= 0) {
            stopExamTimer();
            showToast(
              "Waktu 45 menit habis! Jawaban otomatis dikirim.",
              "error",
            );
            submitExamNow();
          }
        }, 1000);
      }

      /**
       * Memulai sesi ujian penuh atau sesi Drill Mode (hanya soal salah/kosong)
       */
      function startExam(
        quizId,
        customQuestionsSubset = null,
        isDrillMode = false,
      ) {
        const quiz = state.quizzes.find((q) => q.id === quizId);
        if (!quiz) {
          showToast("Paket soal tidak ditemukan.", "error");
          return;
        }

        state.currentQuiz = quiz;
        const sourceQuestions =
          Array.isArray(customQuestionsSubset) &&
          customQuestionsSubset.length > 0
            ? customQuestionsSubset
            : quiz.questions;

        // 1. Acak urutan nomor soal menggunakan Fisher-Yates shuffle
        const shuffledQuestions = fisherYatesShuffle(sourceQuestions).map(
          (q) => {
            // 2. Acak urutan pilihan ganda (A-E) pada masing-masing soal
            // Penilaian tetap akurat karena dicocokkan berdasarkan option.id unik ('opt_a' dst.)
            const shuffledOptions = fisherYatesShuffle(q.options);
            return {
              id: q.id,
              questionText: q.questionText,
              options: shuffledOptions,
              correctOptionId: q.correctOptionId,
            };
          },
        );

        state.examSession = {
          quizId: quiz.id,
          quizTitle: quiz.title,
          isDrillMode: Boolean(isDrillMode),
          questions: shuffledQuestions,
        };

        state.activeQuestionIndex = 0;
        state.userAnswers = {};
        state.evaluationResult = null;
        state.view = "EXAM";

        startExamTimer();
        renderApp();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function buildExamLeftCardContentHtml() {
        const questions = state.examSession.questions;
        const total = questions.length;
        const currentIdx = state.activeQuestionIndex;
        const activeQuestion = questions[currentIdx];
        if (!activeQuestion) return "";

        const selectedOptId = state.userAnswers[activeQuestion.id] || null;

        const optionsHtml = activeQuestion.options
          .map((opt, optIdx) => {
            const displayLetter = OPTION_LETTERS[optIdx];
            const isSelected = selectedOptId === opt.id;

            return `
          <button
            type="button"
            id="exam-opt-btn-${optIdx}"
            onclick="selectExamOption('${activeQuestion.id}', '${opt.id}')"
            class="w-full text-left group flex items-start gap-3.5 p-3.5 sm:p-4 rounded-xl border ${
              isSelected
                ? "border-blue-600 bg-blue-50/60 shadow-2xs ring-1 ring-blue-600/20"
                : "border-[#E2E8F0] bg-white hover:border-blue-300 hover:bg-slate-50/80"
            }">
            <span id="exam-opt-badge-${optIdx}" class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 ${
              isSelected
                ? "bg-[#2563EB] text-white shadow-2xs"
                : "bg-slate-100 text-slate-700 group-hover:bg-blue-100 group-hover:text-[#2563EB]"
            }">
              ${displayLetter}
            </span>
            <span id="exam-opt-text-${optIdx}" class="flex-1 text-sm sm:text-base leading-relaxed pt-0.5 ${
              isSelected
                ? "font-semibold text-slate-900"
                : "font-medium text-slate-700"
            }">
              ${escapeHtml(opt.text)}
            </span>
          </button>
        `;
          })
          .join("");

        return `
          <!-- Body Teks Pertanyaan & Pilihan Ganda + Tombol Navigasi Menyatu (Padding Atas = Bawah) -->
          <div class="p-4 sm:p-5">
            <div class="text-base sm:text-lg font-semibold text-slate-900 leading-relaxed mb-5 whitespace-pre-line">
              ${escapeHtml(activeQuestion.questionText)}
            </div>

            <div class="space-y-2.5">
              ${optionsHtml}
            </div>

            <!-- Tombol Kembali & Selanjutnya Menyatu di Dalam Card Soal -->
            <div class="mt-5 pt-4 border-t border-slate-100 grid grid-cols-2 gap-3">
              <button
                type="button"
                onclick="goToQuestionIndex(${currentIdx - 1})"
                ${currentIdx === 0 ? "disabled" : ""}
                class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-transparent border ${
                  currentIdx === 0
                    ? "text-slate-300 border-slate-200 cursor-not-allowed"
                    : "text-slate-700 border-[#E2E8F0] hover:border-slate-400 hover:text-slate-900"
                }">
                ← Kembali
              </button>
              <button
                type="button"
                onclick="goToQuestionIndex(${currentIdx + 1})"
                ${currentIdx === total - 1 ? "disabled" : ""}
                class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold border ${
                  currentIdx === total - 1
                    ? "bg-blue-300 text-white border-blue-300 cursor-not-allowed"
                    : "bg-[#2563EB] text-white border-[#2563EB] hover:bg-[#1D4ED8] shadow-xs"
                }">
                Selanjutnya →
              </button>
            </div>
          </div>
        `;
      }

      function getNavGridBtnClass(idx) {
        const q = state.examSession.questions[idx];
        const isCurrent = idx === state.activeQuestionIndex;
        const isAnswered = q && Boolean(state.userAnswers[q.id]);
        let btnStyle =
          "relative h-10 rounded-xl border text-xs font-bold flex items-center justify-center ";
        btnStyle += isAnswered
          ? "bg-[#2563EB] text-white border-[#2563EB] hover:bg-[#1D4ED8]"
          : "bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200/70";
        if (isCurrent) {
          btnStyle += " ring-2 ring-[#2563EB] ring-offset-2 font-extrabold";
        }
        return btnStyle;
      }

      function buildExamNavGridHtml() {
        const questions = state.examSession.questions;
        return questions
          .map(
            (q, idx) => `
          <button
            type="button"
            id="exam-nav-btn-${idx}"
            onclick="goToQuestionIndex(${idx})"
            class="${getNavGridBtnClass(idx)}"
            title="Soal Nomor ${idx + 1}">
            <span>${idx + 1}</span>
          </button>
        `,
          )
          .join("");
      }

      function selectExamOption(questionId, optionId) {
        state.userAnswers[questionId] = optionId;
        const currentIdx = state.activeQuestionIndex;
        const activeQuestion = state.examSession.questions[currentIdx];
        if (!activeQuestion) return;

        // O(1) in-place class update untuk 5 tombol opsi (0 innerHTML parsing)
        activeQuestion.options.forEach((opt, optIdx) => {
          const isSelected = opt.id === optionId;
          const btnEl = document.getElementById(`exam-opt-btn-${optIdx}`);
          const badgeEl = document.getElementById(`exam-opt-badge-${optIdx}`);
          const textEl = document.getElementById(`exam-opt-text-${optIdx}`);
          if (btnEl && badgeEl && textEl) {
            btnEl.className = `w-full text-left group flex items-start gap-3.5 p-3.5 sm:p-4 rounded-xl border ${
              isSelected
                ? "border-blue-600 bg-blue-50/60 shadow-2xs ring-1 ring-blue-600/20"
                : "border-[#E2E8F0] bg-white hover:border-blue-300 hover:bg-slate-50/80"
            }`;
            badgeEl.className = `w-8 h-8 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 ${
              isSelected
                ? "bg-[#2563EB] text-white shadow-2xs"
                : "bg-slate-100 text-slate-700 group-hover:bg-blue-100 group-hover:text-[#2563EB]"
            }`;
            textEl.className = `flex-1 text-sm sm:text-base leading-relaxed pt-0.5 ${
              isSelected
                ? "font-semibold text-slate-900"
                : "font-medium text-slate-700"
            }`;
          }
        });

        // O(1) update hanya pada 1 tombol nomor soal aktif di panel kanan
        const navBtnEl = document.getElementById(`exam-nav-btn-${currentIdx}`);
        if (navBtnEl) {
          navBtnEl.className = getNavGridBtnClass(currentIdx);
        }
      }

      function goToQuestionIndex(index) {
        const total = state.examSession.questions.length;
        const prevIdx = state.activeQuestionIndex;
        if (index < 0 || index >= total || index === prevIdx) return;

        state.activeQuestionIndex = index;
        const leftCardEl = document.getElementById("exam-left-card");
        if (leftCardEl) {
          leftCardEl.innerHTML = buildExamLeftCardContentHtml();
          // Hanya update 2 tombol nomor soal (soal sebelumnya & soal baru) tanpa menyentuh 48 tombol lainnya
          const prevNavBtn = document.getElementById(`exam-nav-btn-${prevIdx}`);
          const nextNavBtn = document.getElementById(`exam-nav-btn-${index}`);
          if (prevNavBtn) prevNavBtn.className = getNavGridBtnClass(prevIdx);
          if (nextNavBtn) nextNavBtn.className = getNavGridBtnClass(index);
        } else {
          renderExam();
        }
      }

        const answered = Object.keys(state.userAnswers).length;
        const unanswered = total - answered;

            ? `Kamu baru menjawab <strong>${answered}</strong> dari <strong>${total}</strong> soal. Masih ada <strong class="text-red-600">${unanswered} soal</strong> yang belum diisi (otomatis dihitung salah). Yakin ingin mengakhiri?`
            : `Kamu telah menjawab seluruh <strong>${total} soal</strong> pada paket ujian ini. Yakin ingin mengakhiri dan melihat evaluasi nilai?`;

        openModal(`
        <div class="bg-white rounded-2xl border border-[#E2E8F0] shadow-xl max-w-md w-full p-6 animate-view">
          <div class="w-12 h-12 rounded-2xl ${unanswered > 0 ? "bg-amber-50 border-amber-200 text-amber-600" : "bg-blue-50 border-blue-200 text-[#2563EB]"} border flex items-center justify-center mb-4">

              Ya, Kumpulkan

        </div>
      `);

      function openExitExamModal() {
        openModal(`
        <div class="bg-white rounded-2xl border border-[#E2E8F0] shadow-xl max-w-md w-full p-6 animate-view">
          <h3 class="text-base font-bold text-slate-900">Keluar dari Sesi Ujian?</h3>

          <div class="mt-6 flex items-center justify-end gap-2.5">

          state.examSession.questions,
          state.userAnswers,

        renderApp();
        window.scrollTo({ top: 0, behavior: "smooth" });

                  onclick="openExitExamModal()"
                  class="py-2.5 px-3 rounded-xl text-xs font-semibold text-slate-600 hover:text-red-600 hover:bg-red-50 border border-[#E2E8F0] transition flex items-center justify-center text-center">
                  Keluar Ujian
                </button>

                <button
                  type="button"
                  onclick="openSubmitExamModal()"
                  class="py-2.5 px-3 rounded-xl text-xs font-bold text-white bg-[#2563EB] hover:bg-[#1D4ED8] shadow-sm transition flex items-center justify-center gap-1.5 text-center">
                  <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                  <span>Kirim Jawaban</span>
                </button>
              </div>
            </aside>

          </div>
        </section>
      `;
      }

      /*************************************************************************
       * 9. VIEW D: HALAMAN EVALUASI (EVALUATION VIEW) & DRILL MODE
       *************************************************************************/
      function handleRetryAllQuestions() {
        if (!state.currentQuiz) return;
        startExam(state.currentQuiz.id, null, false);
        showToast("Ujian diulang kembali dengan pengacakan soal baru.", "info");
      }

      function handleRetryWrongOnly() {
        if (!state.evaluationResult || !state.currentQuiz) return;

        const wrongQuestionIds = state.evaluationResult.details
          .filter((item) => !item.isCorrect)
          .map((item) => item.questionId);

        if (wrongQuestionIds.length === 0) {
          showToast(
            "Luar biasa! Tidak ada jawaban yang salah atau kosong.",
            "success",
          );
          return;
        }

        // Ambil struktur soal asli dari paket untuk ID soal yang salah/kosong
        const subsetQuestions = state.currentQuiz.questions.filter((q) =>
          wrongQuestionIds.includes(q.id),
        );
        startExam(state.currentQuiz.id, subsetQuestions, true);
        showToast(
          `Drill Mode dimulai: Mengulang ${subsetQuestions.length} soal yang salah/kosong.`,
          "info",
        );
      }

      function renderEvaluation() {
        const mainEl = document.getElementById("app-main");
        const result = state.evaluationResult;
        if (!result) return;

        const hasWrongOrEmpty = result.wrongOrEmptyCount > 0;
        const scoreColorClass =
          result.finalScore >= 80
            ? "text-[#10B981]"
            : result.finalScore >= 60
              ? "text-[#2563EB]"
              : "text-[#EF4444]";

        const reviewCardsHtml = result.details
          .map((item) => {
            const statusBadge = item.isCorrect
              ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-[#ECFDF5] text-[#10B981] border border-emerald-200">✓ Benar</span>`
              : item.isUnanswered
                ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-[#FEF2F2] text-[#EF4444] border border-red-200">✕ Jawaban Salah (Tidak Dijawab)</span>`
                : `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-[#FEF2F2] text-[#EF4444] border border-red-200">✕ Jawaban Salah</span>`;

            // Render evaluasi detail jawaban user & kunci jawaban
            const userChoiceBox = item.isUnanswered
              ? `
            <div class="p-3.5 rounded-xl bg-red-50 text-red-700 border border-red-200 flex items-start gap-2.5">
              <span class="font-extrabold text-sm leading-none mt-0.5">✕</span>
              <div class="text-xs sm:text-sm">
                <span class="font-bold block">Jawaban Kamu (Salah):</span>
                <span class="italic font-semibold">Tidak Dijawab (Dikosongkan)</span>
              </div>
            </div>
          `
              : item.isCorrect
                ? `
            <div class="p-3.5 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-start gap-2.5">
              <span class="font-extrabold text-sm leading-none mt-0.5">✓</span>
              <div class="text-xs sm:text-sm">
                <span class="font-bold block">Jawaban Kamu (Benar):</span>
                <span>${escapeHtml(item.userOptionText)}</span>
              </div>
            </div>
          `
                : `
            <div class="p-3.5 rounded-xl bg-red-50 text-red-700 border border-red-200 flex items-start gap-2.5">
              <span class="font-extrabold text-sm leading-none mt-0.5">✕</span>
              <div class="text-xs sm:text-sm">
                <span class="font-bold block">Jawaban Kamu (Kurang Tepat):</span>
                <span>${escapeHtml(item.userOptionText)}</span>
              </div>
            </div>
          `;

            const correctKeyBox = !item.isCorrect
              ? `
          <div class="p-3.5 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-start gap-2.5">
            <span class="font-extrabold text-sm leading-none mt-0.5">✓</span>
            <div class="text-xs sm:text-sm">
              <span class="font-bold block">Kunci Jawaban yang Benar:</span>
              <span>${escapeHtml(item.correctOptionText)}</span>
            </div>
          </div>
        `
              : "";

            return `
          <article class="perf-card bg-white rounded-2xl border border-[#E2E8F0] shadow-sm p-5 sm:p-6">
            <div class="flex items-center justify-between gap-2 pb-3.5 mb-3.5 border-b border-slate-100">
              <span class="text-xs font-extrabold uppercase tracking-wider text-slate-500">
                Soal No. ${item.number}
              </span>
              ${statusBadge}
            </div>

            <p class="text-sm sm:text-base font-semibold text-slate-900 leading-relaxed mb-4 whitespace-pre-line">
              ${escapeHtml(item.questionText)}
            </p>

            <div class="grid grid-cols-1 ${!item.isCorrect ? "md:grid-cols-2" : ""} gap-3">
              ${userChoiceBox}
              ${correctKeyBox}
            </div>
          </article>
        `;
          })
          .join("");

        mainEl.innerHTML = `
        <section class="max-w-4xl mx-auto animate-view">

          <!-- HEADER SKOR & METRIK REALTIME -->
          <div class="bg-white rounded-2xl border border-[#E2E8F0] shadow-sm p-6 sm:p-8 mb-6">
            <div class="flex flex-col items-center justify-center text-center py-4">
              <span class="text-xs font-bold uppercase tracking-widest text-slate-500">Skor Akhir</span>
              <div class="text-6xl sm:text-7xl font-extrabold tracking-tight my-2.5 ${scoreColorClass}">
                ${result.finalScore}
              </div>
              <div class="flex items-center justify-center gap-3 mt-1 text-xs sm:text-sm font-semibold">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#ECFDF5] text-[#10B981] border border-emerald-200">
                  ✓ ${result.correctCount} Benar
                </span>
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#FEF2F2] text-[#EF4444] border border-red-200">
                  ✕ ${result.wrongOrEmptyCount} Salah
                </span>
              </div>
            </div>

            <!-- 3 Tombol Aksi Navigasi -->
            <div class="mt-6 pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div class="w-full sm:w-auto flex flex-col sm:flex-row items-center gap-2.5">
                <!-- 1. Ulangi -->
                <button
                  type="button"
                  onclick="handleRetryAllQuestions()"
                  class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-white bg-[#2563EB] hover:bg-[#1D4ED8] shadow-xs transition">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                  <span>Ulangi</span>
                </button>

                <!-- 2. Evaluasi (Drill Mode) -->
                <button
                  type="button"
                  onclick="handleRetryWrongOnly()"
                  ${!hasWrongOrEmpty ? "disabled" : ""}
                  class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold border transition ${
                    hasWrongOrEmpty
                      ? "bg-amber-50 text-amber-800 border-amber-300 hover:bg-amber-100 shadow-2xs"
                      : "bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed"
                  }">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                  <span>
                    ${hasWrongOrEmpty ? `Evaluasi (${result.wrongOrEmptyCount} Soal)` : "Semua Jawaban Sudah Benar 🎉"}
                  </span>
                </button>
              </div>

              <!-- 3. Kembali ke Beranda -->
              <button
                type="button"
                onclick="navigateToHome()"
                class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-slate-700 bg-white hover:bg-slate-50 border border-[#E2E8F0] transition">
                <span>Kembali ke Beranda</span>
              </button>
            </div>
          </div>  

          <div class="space-y-4">
            ${reviewCardsHtml}
          </div>

        </section>

        <!-- Tombol Bulat Scroll ke Paling Atas (Khusus Halaman Evaluasi) -->
        <button
          type="button"
          onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
          title="Scroll ke Paling Atas"
          aria-label="Scroll ke Paling Atas"
          class="fixed bottom-6 right-6 z-50 w-12 h-12 rounded-full bg-[#2563EB] hover:bg-[#1D4ED8] text-white shadow-lg hover:shadow-xl flex items-center justify-center transition-all duration-200 hover:-translate-y-0.5 active:scale-95 cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
          </svg>
        </button>
      `;
      }

      /*************************************************************************
       * 10. KEYBOARD SHORTCUTS (EXAM VIEW: A-E Pilih Opsi, Panah Navigasi)
       *************************************************************************/
      window.addEventListener("keydown", (event) => {
        // Abaikan shortcut jika tidak di halaman EXAM, atau jika modal sedang terbuka
        if (state.view !== "EXAM") return;
        const modalRoot = document.getElementById("modal-root");
        if (modalRoot && !modalRoot.classList.contains("hidden")) return;

        // Abaikan jika user sedang mengetik di input/textarea
        const activeTag = document.activeElement
          ? document.activeElement.tagName.toLowerCase()
          : "";
        if (
          activeTag === "input" ||
          activeTag === "textarea" ||
          activeTag === "select"
        )
          return;

        const questions = state.examSession.questions;
        const currentIdx = state.activeQuestionIndex;
        const activeQuestion = questions[currentIdx];
        if (!activeQuestion) return;

        const key = event.key.toUpperCase();

        // Shortcut A, B, C, D, E untuk memilih jawaban sesuai urutan tampilan layar
        const letterIndex = OPTION_LETTERS.indexOf(key);
        if (letterIndex !== -1 && activeQuestion.options[letterIndex]) {
          event.preventDefault();
          const chosenOption = activeQuestion.options[letterIndex];
          selectExamOption(activeQuestion.id, chosenOption.id);
          return;
        }

        // Shortcut Panah Kiri (←) dan Panah Kanan (→) untuk berpindah soal
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          if (currentIdx > 0) {
            goToQuestionIndex(currentIdx - 1);
          }
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          if (currentIdx < questions.length - 1) {
            goToQuestionIndex(currentIdx + 1);
          }
        }
      });

      /*************************************************************************
       * 11. MASTER RENDERER & INITIALIZATION
       *************************************************************************/
      function renderApp() {
        const mainEl = document.getElementById("app-main");
        if (mainEl) {
          mainEl.className =
            state.view === "EXAM"
              ? "flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4"
              : "flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8";
        }
        renderHeader();
        if (state.view === "HOME") {
          renderHome();
        } else if (state.view === "EDITOR") {
          renderEditor();
        } else if (state.view === "EXAM") {
          renderExam();
        } else if (state.view === "EVALUATION") {
          renderEvaluation();
        }
      }

      // Bootstrapping aplikasi saat halaman selesai dimuat
      document.addEventListener("DOMContentLoaded", () => {
        loadQuizzesFromStorage();
        renderApp();
      });
    </script>
  </body>
</html>
